<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      width: 280px; 
      padding: 16px; 
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f8fafc;
    }
    h1 { font-size: 16px; font-weight: 600; color: #1e293b; margin-bottom: 12px; }
    button { 
      width: 100%; 
      padding: 12px; 
      background: #3b82f6; 
      color: white; 
      border: none; 
      border-radius: 8px; 
      font-size: 14px;
      font-weight: 500;
      cursor: pointer; 
    }
    button:hover { background: #2563eb; }
    button:disabled { background: #94a3b8; cursor: not-allowed; }
    #status { 
      margin-top: 12px; 
      text-align: center; 
      font-size: 13px;
      color: #10b981; 
    }
    .error { color: #ef4444; }
  </style>
</head>
<body>
  <h1>Job Seiri</h1>
  <button id="saveBtn">この求人を保存</button>
  <div id="status"></div>
  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
