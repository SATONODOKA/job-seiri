<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      width: 280px; 
      padding: 16px; 
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f8fafc;
    }
    h1 { font-size: 16px; font-weight: 600; color: #1e293b; margin-bottom: 12px; }
    button { 
      width: 100%; 
      padding: 12px; 
      background: #3b82f6; 
      color: white; 
      border: none; 
      border-radius: 8px; 
      font-size: 14px;
      font-weight: 500;
      cursor: pointer; 
    }
    button:hover { background: #2563eb; }
    button:disabled { background: #94a3b8; cursor: not-allowed; }
    #status { 
      margin-top: 12px; 
      text-align: left; 
      font-size: 12px;
      color: #10b981; 
      line-height: 1.5;
      word-wrap: break-word;
      white-space: pre-line;
    }
    .processing {
      color: #3b82f6;
      background: #eff6ff;
      padding: 8px;
      border-radius: 4px;
      border: 1px solid #bfdbfe;
    }
    .error { 
      color: #ef4444; 
      background: #fef2f2;
      padding: 8px;
      border-radius: 4px;
      border: 1px solid #fecaca;
    }
    #consent {
      padding: 8px;
      background: #f0f9ff;
      border-radius: 4px;
      margin-top: 8px;
      font-size: 11px;
      color: #1e40af;
      line-height: 1.4;
    }
    #consent a {
      color: #2563eb;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h1>求人ブックマーク</h1>
  <button id="saveBtn">この求人を保存</button>
  <div id="consent">
    <p>このボタンをクリックすると、ページのURL、タイトル、本文が送信され、AIで求人情報が抽出されます。</p>
    <p style="margin-top: 4px;"><a href="https://job-seiri.netlify.app/privacy-policy" target="_blank">プライバシーポリシー</a></p>
  </div>
  <div id="status"></div>
  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
